templates:
  mit_header: |
    File: {{ filename }}
    Copyright (c) {{ year }} {{ .Author }}
    SPDX-License-Identifier: MIT

    This software is released under the MIT License.
    https://opensource.org/licenses/MIT

  mit_footer: |
    Copyright (c) {{ year }} {{ .Author }}

data:
  Author: Michael Harris

comment_styles:
  go_line:
    prefix: "// "

rules:
  - id: go-files
    match: "**/*.go"
    header:
      template: mit_header
      newline_after: true
    footer:
      template: mit_footer
      newline_before: true
    comment_style: go_line

exclude:
  - "**/.git/"
