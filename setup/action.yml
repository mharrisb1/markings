name: "Setup Markings"
description: "Downloads and installs the markings CLI"
inputs:
  version:
    description: "Version to install (e.g., v0.1.0, latest, or local)"
    required: false
    default: "latest"
runs:
  using: "composite"
  steps:
    - name: Install Markings
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"

        if [ "$VERSION" = "local" ]; then
          echo "Building markings from local source..."
          BIN_DIR="$RUNNER_TEMP/markings-local"
          mkdir -p "$BIN_DIR"
          go build -o "$BIN_DIR/markings" .
          chmod +x "$BIN_DIR/markings"
          echo "$BIN_DIR" >> $GITHUB_PATH
          exit 0
        fi

        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          VERSION=$(curl -sL https://api.github.com/repos/mharrisb1/markings/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        fi

        OS=$(uname -s)
        EXT="tar.gz"
        case "$OS" in
          Linux) OS="Linux" ;;
          Darwin) OS="Darwin" ;;
          MINGW*|MSYS*|CYGWIN*) OS="Windows"; EXT="zip" ;;
        esac

        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64|amd64) ARCH="x86_64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        URL="https://github.com/mharrisb1/markings/releases/download/${VERSION}/markings_${OS}_${ARCH}.${EXT}"
        BIN_DIR="$RUNNER_TEMP/markings-${VERSION}"

        echo "Downloading markings ${VERSION} for ${OS}-${ARCH} from ${URL}..."
        mkdir -p "$BIN_DIR"

        if [ "$EXT" = "zip" ]; then
          curl -sL -o "$BIN_DIR/archive.zip" "$URL"
          unzip -q -o "$BIN_DIR/archive.zip" "markings.exe" -d "$BIN_DIR"
          rm "$BIN_DIR/archive.zip"
        else
          curl -sL "$URL" | tar -xz -C "$BIN_DIR" markings
        fi

        chmod +x "$BIN_DIR"/markings*
        echo "$BIN_DIR" >> $GITHUB_PATH
