name: "Markings Fix"
description: "Automatically applies or updates banner markings"
inputs:
  version:
    description: "Version of markings to install"
    required: false
    default: "latest"
  args:
    description: "Additional arguments for markings fix"
    required: false
runs:
  using: "composite"
  steps:
    - name: Ensure Setup
      uses: ./setup
      with:
        version: ${{ inputs.version }}
    - name: Run Fix
      shell: bash
      run: markings fix ${{ inputs.args }}
